# 工作流声明 —— agent 看到的就是这里定义的东西,节点图对它不可见。
id: sdxl_turbo
title: SDXL Turbo 文生图
description: >
  快速文生图(1-4 步)。用于验证整条链路,也是最便宜的冒烟工作流。
  CFG 固定 1.0 —— Turbo 系列是蒸馏模型,提高 CFG 只会让画面糊掉,所以不开放这个参数。

template: sdxl_turbo.json

# 这个工作流跑在哪个部署单元上。多个工作流可以共用同一个 endpoint
# (例:同一镜像里的原版与 LoRA 加速版),此时它们共享冷启动和权重。
endpoint: smoke

params:
  prompt:
    type: string
    required: true
    description: 画面内容描述。Turbo 对短提示词响应更好。
  width:
    type: integer
    default: 512
    enum: [512, 768, 1024]
    description: SDXL Turbo 原生 512;拉到 1024 会明显变慢且可能出现构图重复。
  height:
    type: integer
    default: 512
    enum: [512, 768, 1024]
  steps:
    type: integer
    default: 1
    min: 1
    max: 4
    description: Turbo 的蒸馏目标就是 1 步出图;超过 4 步没有收益。
  seed:
    type: integer
    default: null      # null = 每次随机;传具体值可复现
    description: 省略则随机。复现历史产物时必须显式传入。
