name: build h3 image

# 手动触发为主:构建一次 ~15-20 分钟,不适合每次 push 都跑。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag(默认 h3-<run_number>)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # runner 默认只有 14-21GB 可用,而这个镜像未压缩约 18GB,构建期还要算
      # 中间层。清理预装软件(.NET / Android SDK / Haskell 等)能腾到 ~40GB。
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Report available space
        run: df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="h3-${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/h3.Dockerfile
          target: final
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # 用 GitHub Actions cache 保住 base / downloader 层:
          # 改 handler.py 时不必重下 6.94GB 模型,重建只走 final 层。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 主构建刚跑完,sage-builder 层在 GHA cache 里全热,这一步是纯 cache
      # 命中(秒级)。单独跑 extract workflow 曾因 cache 不热撞 GHA 6h 硬超时。
      - name: Extract sage wheel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/h3.Dockerfile
          target: sage-builder
          push: false
          outputs: type=local,dest=/tmp/sage-out
          cache-from: type=gha
          provenance: false

      - name: Upload wheel to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHL=$(find /tmp/sage-out -name "*.whl" | head -1)
          if [ -z "$WHL" ]; then echo "未找到 wheel,跳过"; exit 0; fi
          TAG="sage-wheel"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "SageAttention wheel (自托管)" \
                 --notes "build-h3 顺产的 sage wheel,cu130/sm90。"
          gh release upload "$TAG" "$WHL" --clobber --repo "$GITHUB_REPOSITORY"
          echo "- sage wheel: $(basename "$WHL") -> release $TAG" >> $GITHUB_STEP_SUMMARY

      # 这些数字直接决定 H3 阶段能不能沿用这条路,记录下来
      - name: Report image size
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          {
            echo "### 构建结果"
            echo "- 镜像: \`$IMAGE\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> $GITHUB_STEP_SUMMARY
          if docker manifest inspect "$IMAGE" > /tmp/manifest.json 2>/dev/null; then
            TOTAL=$(jq '[.layers[].size] | add' /tmp/manifest.json)
            LAYERS=$(jq '.layers | length' /tmp/manifest.json)
            BIGGEST=$(jq '[.layers[].size] | max' /tmp/manifest.json)
            {
              echo "- 压缩后总大小: $(echo "scale=2; $TOTAL/1000000000" | bc) GB"
              echo "- 层数: $LAYERS"
              echo "- 最大单层: $(echo "scale=2; $BIGGEST/1000000000" | bc) GB (GHCR 上限 10GB)"
            } >> $GITHUB_STEP_SUMMARY
          fi
          echo "- runner 剩余磁盘: $(df -h / | tail -1 | awk '{print $4}')" >> $GITHUB_STEP_SUMMARY
