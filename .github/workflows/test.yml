name: test

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      - name: Tests
        run: pytest -q

      # 启动路径的语法错误只会在线上爆炸(CMD 构建期不执行),这里当门禁拦住。
      - name: Syntax check (worker + scripts)
        run: |
          python -m compileall -q comfyagent worker scripts
          bash -n worker/src/start.sh

      - name: Workflow definitions load
        run: |
          python -c "
          from pathlib import Path
          from comfyagent.core.registry import load_workflows
          wfs = load_workflows(Path('workflows'))
          assert wfs, '没有加载到任何工作流'
          print('loaded:', sorted(wfs))
          "

      # editable 安装掩盖过一次真问题:正式 wheel 里没有仓库根,部署声明必须
      # 作为 package data 随包走,否则 deploy 命令装完就用不了。
      - name: Built wheel is self-contained
        run: |
          python -m pip wheel --no-deps -w /tmp/wh .
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install -q PyYAML /tmp/wh/comfyagent-*.whl
          # 必须离开仓库根再导入:否则 cwd 里的源码目录会顶掉刚装的 wheel,
          # 这个测试就变成了自测源码(2026-08-21 复核指出的假隔离)。
          cd /tmp
          /tmp/wv/bin/python -c "
          import comfyagent.core.deploy as d
          assert '/tmp/wv/' in d.__file__, f'导入的不是 wheel 里的模块: {d.__file__}'
          specs = d.load_spec()
          assert specs, '正式 wheel 里读不到部署声明'
          print('wheel 自包含 OK:', d.__file__, sorted(specs))
          "

      # 部署声明必须能解析,且不含持续计费配置(workers_min>0 需人工确认)
      - name: Deployment spec sanity
        run: |
          python -c "
          from comfyagent.core.deploy import load_spec
          specs = load_spec()
          for name, s in specs.items():
              assert s.get('image'), f'{name} 缺 image'
              assert s.get('workers_min', 0) == 0, f'{name} workers_min>0 会持续计费'
          print('deployments OK:', sorted(specs))
          "
