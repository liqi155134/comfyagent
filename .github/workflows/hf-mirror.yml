name: mirror h3 models to HF

# 把 Comfy-Org/MiniMax-H3 里 T2V 需要的 5 个文件(44.4GB)转存到自己的
# HF repo —— RunPod model caching 按整仓下载,官方仓 471GB 不能直接用。
# 逐文件 下载→上传→删除,磁盘峰值 = 最大单文件 21GB,GHA runner 扛得住。
# HF_TOKEN(write 权限)放在仓库 Actions Secrets 里,不进代码不进对话。
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "目标 repo(如 yourname/minimax-h3-t2v)"
        required: true
        type: string
      private:
        description: "建成 private repo"
        required: false
        type: boolean
        default: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Mirror files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET: ${{ inputs.target_repo }}
          PRIVATE: ${{ inputs.private }}
        run: |
          pip -q install "huggingface_hub[hf_xet]"
          python - << 'PY'
          import os, shutil
          from huggingface_hub import HfApi, hf_hub_download

          SRC = "Comfy-Org/MiniMax-H3"
          FILES = [
              "diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors",
              "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors",
              "vae/minimax_h3_video_vae_fp16.safetensors",
              "vae/minimax_h3_audio_vae_fp32.safetensors",
              "loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors",
          ]
          api = HfApi(token=os.environ["HF_TOKEN"])
          target = os.environ["TARGET"]
          api.create_repo(target, repo_type="model",
                          private=os.environ.get("PRIVATE") == "true", exist_ok=True)
          existing = set(api.list_repo_files(target))
          for path in FILES:
              if path in existing:
                  print(f"跳过(已存在): {path}", flush=True)
                  continue
              print(f"下载: {path}", flush=True)
              local = hf_hub_download(SRC, path, local_dir="/tmp/mirror")
              print(f"上传: {path}", flush=True)
              api.upload_file(path_or_fileobj=local, path_in_repo=path,
                              repo_id=target,
                              commit_message=f"mirror {path} from {SRC}")
              shutil.rmtree("/tmp/mirror", ignore_errors=True)
              print(f"完成: {path}", flush=True)
          print("全部完成:", target)
          PY
