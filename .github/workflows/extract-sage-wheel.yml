name: extract sage wheel to release

# sage wheel 自托管:从 GHA 缓存里把编好的 sage-builder 阶段跑出来
# (cache 命中时几分钟,不重编),提取 wheel 上传 GitHub Release。
# 之后 h3.Dockerfile 优先从 Release 下 wheel,sage 层从 ~1 小时变几秒。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag(默认 sage-<SAGE_REF 短 SHA>)"
        required: false
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build sage-builder stage (cache hit) and export wheel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/h3.Dockerfile
          target: sage-builder
          push: false
          cache-from: type=gha
          outputs: type=local,dest=/tmp/sage-out

      - name: Upload wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL=$(find /tmp/sage-out -name "*.whl" -path "*/sage/dist/*" | head -1)
          [ -z "$WHEEL" ] && WHEEL=$(find /tmp/sage-out -name "sageattention*.whl" | head -1)
          [ -z "$WHEEL" ] && { echo "!! 没找到 wheel"; find /tmp/sage-out -name "*.whl"; exit 1; }
          SAGE_REF=$(grep -oP 'ARG SAGE_REF=\K\w+' docker/h3.Dockerfile | head -1)
          TAG="${{ inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="sage-${SAGE_REF:0:12}"
          echo "wheel: $WHEEL → release $TAG"
          gh release create "$TAG" --title "$TAG" \
            --notes "SageAttention wheel(commit ${SAGE_REF},sm90,torch 2.13 cu130,py3.12,GHA 编译)" \
            2>/dev/null || true
          gh release upload "$TAG" "$WHEEL" --clobber
          echo "### wheel 已发布: $TAG / $(basename $WHEEL)" >> $GITHUB_STEP_SUMMARY
